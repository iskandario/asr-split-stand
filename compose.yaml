# Стенд: сервер распознавания + мониторинг + клиент (запускается раннером на каждый прогон).
# Ресурсы зафиксированы: сервер — 1 CPU, клиент — квота из уровня фактора «устройство».
name: asr-split-stand

services:
  server:
    build: ./server
    image: asr-stand-server:1.0
    cpus: ${SERVER_CPUS:-1}
    mem_limit: 1g
    environment:
      CPU_THREADS: "1"
      COMPUTE_TYPE: int8
      MAX_NEW_TOKENS: "64"
    ports: ["8000:8000"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    mem_limit: 256m
    ports: ["9090:9090"]

  client:
    build: ./client
    image: asr-stand-client:1.0
    profiles: ["run"]                      # только раннер: docker compose run client
    cap_add: [NET_ADMIN]                   # tc netem внутри контейнера
    cpus: ${CLIENT_CPUS:-1}                # уровень фактора «устройство»
    mem_limit: 1536m
    shm_size: 512m
    environment:
      RUN_SPEC: ${RUN_SPEC:-}
    volumes:
      - ./data/audio:/data/audio:ro
      - ./results/raw:/results
    depends_on:
      server: { condition: service_healthy }
