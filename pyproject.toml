[project]
name = "asr-split-stand"
version = "1.0.0"
description = "Экспериментальный стенд: распределение распознавания речи между браузером и сервером"
requires-python = "==3.12.*"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "scipy>=1.14",
  "jiwer>=3.0",
  "matplotlib>=3.9",
  "soundfile>=0.12",
  "huggingface-hub>=0.26",
  "num2words>=0.5.13",
]

[dependency-groups]
dev = [
    "playwright==1.49.1",
    "pytest>=8.3",
]

[tool.uv]
package = false
