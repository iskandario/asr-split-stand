[project]
name = "asr-server"
version = "1.0.0"
description = "Серверное распознавание речи для стенда: FastAPI + faster-whisper"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.32,<0.33",
  "faster-whisper==1.1.0",
  "prometheus-fastapi-instrumentator>=7.0,<8",
  "prometheus-client>=0.21",
  "numpy>=1.26,<2.2",
  "huggingface-hub>=0.26,<0.27",
]

[tool.uv]
package = false
